<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930"><rect width="1200" height="930" fill="#f4f4f0"/><g font-family="Georgia, serif"><text x="60" y="45" font-size="20" fill="#4a5d44" >LOOKOUT WEST / OBSERVED PRICES</text><text x="60" y="99" font-size="42" fill="#4a5d44" >Western energy prices since February</text><text x="60" y="137" font-size="23" fill="#6B6E6A" >West-region CPI-U · February 2026 = 100 · February–August 2026</text><svg x="60" y="150" width="1080" height="605" xmlns="http://www.w3.org/2000/svg" class="pulse-chart pulse-chart--desktop" viewBox="0 0 1000 560" role="img" aria-labelledby="pulse-export-title pulse-export-desc" style="--pulse-origin:54px">
    <title id="pulse-export-title">West-region consumer energy prices after February 2026</title>
    <desc id="pulse-export-desc">Monthly CPI-U indexes, not seasonally adjusted; February 2026 equals 100. Gasoline jumps +22.6% in March and reaches 128.8 in August. Utility gas reaches 106.2 and electricity 101.8. These are observed changes, not estimates of the disruption’s causal effect.</desc>
    <defs><clipPath id="pulse-export-clip"><rect class="pulse-reveal" x="54" y="0" width="704" height="560" /></clipPath></defs>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#6B6E6A"><line x1="54" x2="755" y1="437.40" y2="437.40" stroke="#D9D9D2" stroke-width="1.5" opacity="1"/><text x="42.00" y="442.40" text-anchor="end" fill="#252824">100</text><line x1="54" x2="755" y1="356.20" y2="356.20" stroke="#D9D9D2" stroke-width="0.75" opacity="0.65"/><text x="42.00" y="361.20" text-anchor="end" >110</text><line x1="54" x2="755" y1="275.00" y2="275.00" stroke="#D9D9D2" stroke-width="0.75" opacity="0.65"/><text x="42.00" y="280.00" text-anchor="end" >120</text><line x1="54" x2="755" y1="193.80" y2="193.80" stroke="#D9D9D2" stroke-width="0.75" opacity="0.65"/><text x="42.00" y="198.80" text-anchor="end" >130</text><line x1="54" x2="755" y1="112.60" y2="112.60" stroke="#D9D9D2" stroke-width="0.75" opacity="0.65"/><text x="42.00" y="117.60" text-anchor="end" >140</text><text x="54.00" y="508.00" text-anchor="middle">Feb</text><text x="170.83" y="508.00" text-anchor="middle">Mar</text><text x="287.67" y="508.00" text-anchor="middle">Apr</text><text x="404.50" y="508.00" text-anchor="middle">May</text><text x="521.33" y="508.00" text-anchor="middle">Jun</text><text x="638.17" y="508.00" text-anchor="middle">Jul</text><text x="755.00" y="508.00" text-anchor="middle">Aug</text><line x1="110.08" x2="110.08" y1="58" y2="478" stroke="#6B6E6A" stroke-width="1" stroke-dasharray="3 5" opacity=".6"/><text x="118.08" y="23.00" font-size="15">Disruption begins</text><text x="118.08" y="44.00" font-size="16" fill="#252824">Feb. 28</text><g clip-path="url(#pulse-export-clip)"><path d="M54.00 437.40 L170.83 445.76 L287.67 427.17 L404.50 414.29 L521.33 419.40 L638.17 412.30 L755.00 423.14" fill="none" stroke="#252824" stroke-opacity=".5" stroke-width="3.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path data-pulse-series="electricity" d="M54.00 437.40 L170.83 445.76 L287.67 427.17 L404.50 414.29 L521.33 419.40 L638.17 412.30 L755.00 423.14" fill="none" stroke="#92B9C9" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path data-pulse-series="utilityGas" d="M54.00 437.40 L170.83 455.41 L287.67 455.03 L404.50 421.54 L521.33 397.94 L638.17 384.34 L755.00 387.27" fill="none" stroke="#4A5D44" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path data-pulse-series="gasoline" d="M54.00 437.40 L170.83 254.01 L287.67 157.35 L404.50 106.09 L521.33 186.05 L638.17 236.26 L755.00 203.32" fill="none" stroke="#D94E3D" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><circle cx="54" cy="437.40" r="3" fill="#F4F4F0" stroke="#4A5D44" stroke-width="1.5"/><circle class="pulse-end" cx="755" cy="203.32" r="4" fill="#D94E3D" stroke="#D94E3D" stroke-width=".7"/><g class="pulse-end-label" fill="#252824"><path d="M762 203.32L775 189.32H783" fill="none" stroke="#D94E3D" stroke-width="1.3"/><text x="791.00" y="194.32" font-size="20">Gasoline</text><text x="791.00" y="219.32" font-size="21" font-weight="700">+28.8% since Feb.</text></g><circle class="pulse-end" cx="755" cy="387.27" r="3" fill="#4A5D44" stroke="#4A5D44" stroke-width=".7"/><g class="pulse-end-label" fill="#4A5D44"><path d="M762 387.27L775 377.27H783" fill="none" stroke="#4A5D44" stroke-width="1.3"/><text x="791.00" y="382.27" font-size="20">Utility gas</text><text x="791.00" y="407.27" font-size="21" font-weight="700">+6.2%</text></g><circle class="pulse-end" cx="755" cy="423.14" r="3" fill="#92B9C9" stroke="#252824" stroke-width=".7"/><g class="pulse-end-label" fill="#252824"><path d="M762 423.14L775 434.14H783" fill="none" stroke="#92B9C9" stroke-width="1.3"/><text x="791.00" y="439.14" font-size="20">Electricity</text><text x="791.00" y="464.14" font-size="21" font-weight="700">+1.8%</text></g><g class="pulse-annotation" fill="#252824"><circle cx="170.83" cy="254.01" r="3"/><text x="187.83" y="282.01" font-size="17">+22.6% in March</text></g></g></svg><text x="60" y="802" font-size="21" fill="#6B6E6A" >Source: U.S. Bureau of Labor Statistics; Lookout West calculations.</text><text x="60" y="837" font-size="20" fill="#6B6E6A" >Monthly indexes are not seasonally adjusted. Each observation covers the whole month.</text><text x="60" y="872" font-size="20" fill="#6B6E6A" >Electricity and utility gas reflect different markets. Observed changes do not estimate</text><text x="60" y="900" font-size="20" fill="#6B6E6A" >the disruption’s causal effect. Endpoint changes compare August with February, not a year earlier.</text></g></svg>