<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665"><rect width="1200" height="665" fill="#f4f4f0"/><g font-family="Georgia, serif"><text x="60" y="75" font-size="42" fill="#4a5d44" >New Mexico: the annual average matters</text><text x="60" y="124" font-size="24" fill="#5b5b57" >FY2027 direct-revenue sensitivity · August 2026 forecast</text><line x1="60" x2="380" y1="190" y2="190" stroke="#4a5d44" stroke-width="3"/><text x="60" y="237" font-size="32" fill="#4a5d44" >$10 lower</text><text x="60" y="276" font-size="20" fill="#5b5b57" >Annual average oil price</text><text x="60" y="304" font-size="20" fill="#5b5b57" >relative to forecast</text><text x="60" y="394" font-size="40" fill="#4a5d44" >About $565m</text><text x="60" y="437" font-size="24" fill="#4a5d44" >less direct revenue</text><line x1="430" x2="750" y1="190" y2="190" stroke="#4a5d44" stroke-width="3"/><text x="430" y="237" font-size="32" fill="#4a5d44" >No change</text><text x="430" y="276" font-size="20" fill="#5b5b57" >Annual average oil price</text><text x="430" y="304" font-size="20" fill="#5b5b57" >relative to forecast</text><text x="430" y="394" font-size="40" fill="#4a5d44" >$0</text><text x="430" y="437" font-size="24" fill="#4a5d44" >revenue change</text><line x1="800" x2="1120" y1="190" y2="190" stroke="#4a5d44" stroke-width="3"/><text x="800" y="237" font-size="32" fill="#4a5d44" >$10 higher</text><text x="800" y="276" font-size="20" fill="#5b5b57" >Annual average oil price</text><text x="800" y="304" font-size="20" fill="#5b5b57" >relative to forecast</text><text x="800" y="394" font-size="40" fill="#4a5d44" >About $565m</text><text x="800" y="437" font-size="24" fill="#4a5d44" >more direct revenue</text><text x="60" y="525" font-size="21" fill="#5b5b57" >Illustration: price difference × $56.45m. Other assumptions held constant.</text><text x="60" y="565" font-size="23" fill="#4a5d44" >Not collected cash, spendable budget money or residents’ net benefit.</text><text x="60" y="620" font-size="19" fill="#5b5b57" >Source: New Mexico August 2026 revenue forecast, pp. 16 and 41. Lookout West.</text></g></svg>